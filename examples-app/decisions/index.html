<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Decisions · Stenc</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <div class="shell">
      <aside class="sidebar">
        <a class="brand" href="/">Stenc</a>
        <nav class="collection-navigation" aria-label="Document collections"><a class="nav-link" href="/specs/">Specs</a><a class="nav-link" href="/plans/">Plans</a><a class="nav-link" href="/decisions/" aria-current="page">Decisions</a><a class="nav-link" href="/agent-context/">Agent Context</a></nav>
      </aside>
      <main id="main-content" tabindex="-1"><header class="document-header"><div class="kicker">Stenc</div><h1>Decisions</h1><p class="description">Fixed-format documents rendered from structured JSON.</p></header><section class="grid"><div class="empty-state" role="status"><p>No decision documents yet.</p></div></section></main>
    </div>
    <script>
      const skipLink = document.querySelector('.skip-link');
      const mainContent = document.getElementById('main-content');
      if (skipLink && mainContent) {
        skipLink.addEventListener('click', () => {
          requestAnimationFrame(() => mainContent.focus());
        });
      }

      const updateTableScrollRegions = () => {
        const states = Array.from(document.querySelectorAll('.table-scroll-region'))
          .map((region) => ({
            region,
            overflowing: region.scrollWidth > region.clientWidth,
          }));

        states.forEach(({ region, overflowing }) => {
          if (overflowing) {
            region.setAttribute('role', 'region');
            region.setAttribute('aria-label', region.dataset.tableLabel);
            region.setAttribute('tabindex', '0');
            return;
          }
          region.removeAttribute('role');
          region.removeAttribute('aria-label');
          region.removeAttribute('tabindex');
        });
      };
      let tableRegionFrame = null;
      const scheduleTableRegionUpdate = () => {
        if (tableRegionFrame !== null) cancelAnimationFrame(tableRegionFrame);
        tableRegionFrame = requestAnimationFrame(() => {
          tableRegionFrame = null;
          updateTableScrollRegions();
        });
      };
      scheduleTableRegionUpdate();
      window.addEventListener('resize', scheduleTableRegionUpdate);
      document.addEventListener('toggle', scheduleTableRegionUpdate, true);
    </script>
  </body>
</html>
